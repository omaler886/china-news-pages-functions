name: Scheduled refresh and notify

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: pages-functions-refresh
  cancel-in-progress: true

env:
  REFRESH_URL: https://china-news.frostcc.ggff.net/api/refresh?notify=1
  STATUS_URL: https://china-news.frostcc.ggff.net/api/status

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh
        shell: bash
        run: |
          curl -fsS "$REFRESH_URL" > refresh.json
          cat refresh.json

      - name: Validate response
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open('refresh.json','r',encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('ok') is True
          refresh = data.get('refresh') or {}
          telegram = refresh.get('telegram') or {}
          if telegram.get('reason') == 'error':
              raise SystemExit(f"telegram push failed: {telegram.get('error')}")
          print('refresh ok, generatedAt=', data.get('generatedAt'))
          PY

      - name: Check status endpoint
        shell: bash
        run: |
          curl -fsS "$STATUS_URL" > status.json
          cat status.json

      - name: Send Telegram failure alert
        if: failure()
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          if not os.environ.get("TG_BOT_TOKEN") or not os.environ.get("TG_CHAT_ID"):
              print("Telegram alert secrets are missing; skip failure alert.")
              raise SystemExit(0)
          text = (
              "⚠️ 定时刷新失败\n"
              f"仓库: {os.environ['REPO']}\n"
              f"分支: {os.environ['REF_NAME']}\n"
              f"Run: #{os.environ['RUN_NUMBER']}\n"
              f"日志: {os.environ['SERVER_URL']}/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          )
          payload = {
              "chat_id": os.environ["TG_CHAT_ID"],
              "text": text,
              "disable_notification": False
          }
          thread_id = os.environ.get("TG_THREAD_ID", "").strip()
          if thread_id:
              payload["message_thread_id"] = int(thread_id)
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_BOT_TOKEN']}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.read().decode("utf-8"))
          PY
